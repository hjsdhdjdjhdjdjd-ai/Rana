<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mrs.Rana | لوحة ولي الأمر</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<!-- خلفية متحركة -->
<div class="background"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="glow"></div>

<!-- لوحة ولي الأمر -->
<main class="dash-box">
    <div class="avatar" id="avatar">👨‍👩‍👦</div>
    <h1>أهلًا بك 👋</h1>
    <p class="dash-name" id="guardianName">—</p>

    <div class="info-grid">
        <div class="info-item"><span>رقم الهاتف</span><b id="guardianPhone">—</b></div>
        <div class="info-item"><span>الطالب المرتبط</span><b id="linkedStudent">—</b></div>
        <div class="info-item"><span>كود الطالب</span><b id="linkedCode">—</b></div>
        <div class="info-item"><span>وقت تسجيل الدخول</span><b id="loginTime">—</b></div>
    </div>


    <!-- قسم الطالب: يظهر فقط بعد دخول الطالب -->
    <section class="student-area" id="linkedArea" hidden>
        <h3 class="area-title">📝 المطلوب إنجازه على <b id="linkedTasksTitle">—</b></h3>
        <ul class="task-list" id="linkedTasks"></ul>

        <h3 class="area-title">⭐ تقييم اليوم</h3>
        <p class="panel-sub" id="linkedEval">—</p>

        <h3 class="area-title">✉️ رسائل من المعلمة</h3>
        <ul class="msg-list" id="linkedMessages"></ul>
    </section>

    <button type="button" class="logout-btn" id="logoutBtn">تسجيل الخروج</button>

    <p class="demo-note">جلستك محفوظة على هذا الجهاز فقط، ولن يصل إليها غيرك.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="db.js"></script>
<script src="guardian.js"></script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>

</body>
</html>
