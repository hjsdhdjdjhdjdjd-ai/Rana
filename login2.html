<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mrs.Rana | دخول المعلمين</title>
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<!-- خلفية متحركة -->
<div class="background"></div>
<div class="line"></div>
<div class="line"></div>
<div class="line"></div>
<div class="glow"></div>

<!-- شاشة البداية -->
<div class="intro">
    <h1>Mrs.Rana</h1>
</div>

<!-- صندوق تسجيل الدخول -->
<main class="login-box">
    <div class="brand-icon">👩‍🏫</div>
    <h2>تسجيل دخول المعلمين</h2>
    <p class="subtitle">أدخل اسم المستخدم والرقم السري الخاص بك للدخول</p>

    <form id="loginForm" novalidate>
        <div class="input-box code">
            <input type="text" id="username" placeholder=" " autocomplete="off" spellcheck="false">
            <label for="username">اسم المستخدم</label>
        </div>

        <div class="input-box secret has-eye">
            <input type="password" id="secretNumber" placeholder=" " inputmode="numeric" autocomplete="off">
            <label for="secretNumber">الرقم السري</label>
            <button type="button" class="eye-btn" id="toggleSecret" aria-label="إظهار الرقم السري">👁</button>
        </div>

        <div class="remember-row">
            <label>
                <input type="checkbox" id="rememberMe">
                تذكرني على هذا الجهاز
            </label>
        </div>

        <p class="form-error" id="formError" role="alert" aria-live="polite"></p>

        <button type="submit" class="login-btn" id="loginBtn">دخول</button>
    </form>

    <!-- احذف هذا العنصر عند ربط الموقع بقاعدة بيانات -->
    <p class="demo-hint">
        سجل حساب معلم جديد من رابط التسجيل بالأسفل
    </p>

    <a class="alt-link" href="register-teacher.html">تسجيل معلم جديد ←</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="db.js"></script>
<script src="login2.js"></script>
<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>

</body>
</html>
